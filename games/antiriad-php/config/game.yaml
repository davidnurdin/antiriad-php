# The game. Every key is optional (defaults: JumPHP\Kernel\GameConfig::DEFAULTS).
game:
  id: antiriad-php                  # lower case, unique: folder of the games portal, network room filter
  title: "antiriad-php"
  version: 0.1.0
  description: "Après l'apocalypse nucléaire, Tal, un guerrier tribal, part à la recherche d'une armure sacrée venue de l'ancien monde. Avec elle, il doit libérer la Terre des envahisseurs qui l'occupent. Un jeu de plateformes et d'exploration rétro, d'après le classique de 1986."
  width: 320                    # virtual resolution (pixels of the game, scaled to the window)
  height: 180
  scale: 3                      # desktop window = 960 x 540
  background: [16, 16, 32]
  start_scene: App\Scene\TitleScene
  lang: en
  net_url: ws://localhost:8090/ws   # relay server (bin/jumphp relay up); the page can override with ?net=
  online: false
  # what `bin/jumphp test` runs headless (no window), 600 frames = 10 s of game time
  smoke:
    scene: App\Scene\PlayScene
    params: { demo: true }
