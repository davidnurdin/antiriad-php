# Actions of the game => keys / pad / touch. The engine already defines:
#   up (Up, W), down, left, right, confirm, back, pause (see JumPHP\Kernel\Engine::DEFAULT_ACTIONS)
# The original: joystick up = jump (on foot) / thrust (the suit's boots), fire = stone / pulse beam.
actions:
  jump: [Z, pad0:a]
  fire: [Space, Left Ctrl, Right Ctrl, X, pad0:x, pad0:rb]
  suit: [E, Left Shift, Tab, pad0:y]
