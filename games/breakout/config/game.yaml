# Breakout: break every brick with the ball, keep it in play with the paddle.
game:
  id: breakout
  title: "BREAKOUT"
  version: 1.0.0
  description: "Break the wall of bricks with a bouncing ball: 3 lives, a new wall every level."
  descriptions:                 # the description in the playground's languages (jumphp.net shows the visitor's)
    fr: "Cassez le mur de briques avec une balle qui rebondit : 3 vies, un nouveau mur à chaque niveau."
    en: "Break the wall of bricks with a bouncing ball: 3 lives, a new wall every level."
  width: 320
  height: 240
  scale: 3                      # desktop window = 960 x 720
  background: [0, 0, 0]
  start_scene: App\Scene\TitleScene
  lang: en
  net_url: ws://localhost:8090/ws
  online: false
  # browser on-screen buttons (phones): A launches the ball, B / START pause
  touch: { a: Space, b: Escape, start: Escape }
  controls: "Left / Right (or A / D): move the paddle. Space: launch the ball. Escape / P: pause."
  # bin/jumphp test: the computer plays (endless: new game when it loses, next wall when it wins)
  smoke:
    scene: App\Scene\PlayScene
    params: { demo: true }
