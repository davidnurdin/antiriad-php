# Pong: the first JumPHP game. 1 player against the computer, 2 players on one keyboard, or online.
game:
  id: pong
  title: "PONG"
  version: 1.0.0
  description: "The classic, in PHP: against the computer, two players on one keyboard, or online."
  descriptions:                 # the description in the playground's languages (jumphp.net shows the visitor's)
    fr: "Le classique, en PHP : contre l'ordinateur, à deux sur un clavier, ou en ligne."
    en: "The classic, in PHP: against the computer, two players on one keyboard, or online."
  width: 320
  height: 180
  scale: 3
  background: [0, 0, 0]
  start_scene: App\Scene\TitleScene
  lang: en
  net_url: ws://localhost:8090/ws
  online: true
  # browser on-screen buttons (phones): A, B and START send these keys
  touch: { a: Return, b: Escape, start: Return }
  controls: "Player 1: W / S. Player 2: Up / Down. Escape: pause."
  # bin/jumphp test: the computer against itself
  smoke:
    scene: App\Scene\PlayScene
    params: { mode: demo }
