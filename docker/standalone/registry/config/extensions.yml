# The PHP extensions of JumPHP's desktop runtime (docker/desktop: the same commits), compiled into PHP.
ext-sdl:
  type: php-extension
  artifact:
    source:
      type: url
      url: 'https://github.com/davidnurdin/php-sdl/archive/89855c8f4f63b77f9a548007b9c4afe366785b4b.tar.gz'
      extract: php-src/ext/sdl
    metadata:
      license-files: [LICENSE]
      license: MIT
  depends:
    - sdl2
  php-extension:
    arg-type@unix: '--with-sdl=@build_root_path@/bin/sdl2-config'
    arg-type@windows: '--enable-sdl'
    display-name: SDL

ext-sdl_image:
  type: php-extension
  artifact:
