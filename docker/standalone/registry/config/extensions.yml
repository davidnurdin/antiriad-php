    metadata:
      license-files: [LICENSE]
      license: Zlib
  depends:
    - ext-sdl
    - sdl2_image
  php-extension:
    arg-type@unix: '--with-sdl_image=@build_root_path@'
    arg-type@windows: '--enable-sdl_image'
    display-name: ''

