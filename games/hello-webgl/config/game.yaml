# Hello WebGL: the "hello world" of JumPHP\Gl. Spinning 3D cubes drawn by WebGL shaders written in PHP strings,
# a 2D HUD drawn by SDL over them, and post-processing shaders on the whole picture. Every key is optional
# (defaults: JumPHP\Kernel\GameConfig::DEFAULTS).
game:
  id: hello-webgl
  title: "HELLO WEBGL"
  version: 0.1.0
  description: "3D cubes and post-processing shaders (CRT, wave, 4 colours) from PHP, with WebGL in the browser."
  descriptions:                 # the description in the playground's languages (jumphp.net shows the visitor's)
    fr: "Des cubes 3D et des shaders de post-traitement (CRT, vague, 4 couleurs) depuis PHP, avec WebGL dans le navigateur."
    en: "3D cubes and post-processing shaders (CRT, wave, 4 colours) from PHP, with WebGL in the browser."
  width: 320
  height: 180
  scale: 3
  background: [12, 12, 30]
  start_scene: App\Scene\TitleScene
  lang: en
  # the page / window lifecycle: hidden tab or lost focus = this pause menu (JumPHP\Device\Lifecycle)
  pause_scene: App\Scene\PauseScene
  # installable app that plays offline (JumPHP\Device\Pwa): manifest, icons and service worker at build
  pwa: { short_name: WEBGL, theme_color: '#0c0c1e' }
  controls: "Arrows / pad sticks: turn, zoom (LT / RT). Space / A: next shader. Escape / Start: pause."
  touch: { a: Space, b: Escape, start: Escape }
  smoke:
    scene: App\Scene\CubesScene
    params: { demo: true }
