# Actions of the game => keys / pad / touch. The engine already defines:
#   up, down, left, right, confirm, back, pause (see JumPHP\Kernel\Engine::DEFAULT_ACTIONS)
# Redefining one here replaces its bindings.
# Key names: SDL names (Left, Right, Up, Down, Space, Return, Escape, Left Shift, A..Z, 0..9, F1..F12)
# Other sources: pad0:button0..15, pad0:left|right|up|down, touch:left|right|up|down|tap, mouse:1
actions:
  jump: [Space, Up, W, Z, pad0:button0, touch:tap]
