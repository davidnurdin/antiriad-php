# The game. Every key is optional (defaults: JumPHP\Kernel\GameConfig::DEFAULTS).
game:
  id: antiriad-php                  # lower case, unique: folder of the games portal, network room filter
  title: "L'Armure Sacrée d'Antiriad"
  version: 1.0.0
  description: "Après l'apocalypse nucléaire, Tal, un guerrier tribal, part à la recherche d'une armure sacrée venue de l'ancien monde. Avec elle, il doit libérer la Terre des envahisseurs qui l'occupent. Le remake en PHP du classique Amstrad CPC de Palace Software (1986), avec ses graphismes, ses écrans et sa musique d'origine."
  width: 320                    # the CPC's screen: 160 mode 0 pixels drawn 2 wide, 200 lines
  height: 200
  scale: 3
  background: [0, 0, 0]
  start_scene: App\Scene\TitleScene
  pause_scene: App\Scene\PauseScene
  lang: fr
  online: false
  # phones: a floating stick (up = jump / fly), A = throw / fire (Space), B = in / out of the suit (E), START = pause
  touch: { pad: stick, a: Space, b: E, start: Escape, labels: { a: FEU, b: ARMURE } }
  controls: "Flèches : marcher, haut = sauter / voler · Espace : lancer / tirer · Bas : s'accroupir, ramasser, entrer dans l'armure · E : entrer / sortir de l'armure · Échap : pause"
  # what `bin/jumphp test` runs headless (no window), 600 frames = 10 s of game time: a bot plays
  smoke:
    scene: App\Scene\PlayScene
    params: { demo: true }
